# Baut die Windows-Installation (PyInstaller + Inno Setup).
#  - bei jedem Pull Request: Bau + Starttest, Setup.exe als Download unter "Actions"
#  - bei einem Versions-Tag (z. B. v0.8.3): zusaetzlich Release mit der Setup.exe
#  - von Hand: Actions -> Windows-Installer -> "Run workflow"
#    mit Haken "Release veroeffentlichen": legt Tag v<Version> + Release an
name: Windows-Installer

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Release mit Setup.exe veroeffentlichen (Version aus upa_version.py)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pywebview>=5,<7" matplotlib reportlab python-docx pyinstaller

      - name: Version lesen
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import upa_version; print(upa_version.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"
          if ($env:GITHUB_REF -like "refs/tags/v*" -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Tag $env:GITHUB_REF_NAME passt nicht zu upa_version.py ($v)"
          }

      - name: Versionsangaben fuer die .exe
        run: python packaging/version_info.py

      - name: Programm bauen (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed
          --name UPA-Analyzer-Control
          --add-data "index.html;."
          --add-data "assets/icon.png;assets"
          --add-data "assets/icon.ico;assets"
          --icon assets/icon.ico
          --version-file packaging/version_info.txt
          --hidden-import serial.tools.list_ports
          --hidden-import webview.platforms.edgechromium
          --exclude-module tkinter
          --collect-data docx
          upa_server.py

      - name: Icon der .exe pruefen
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $exe = (Resolve-Path "dist\UPA-Analyzer-Control\UPA-Analyzer-Control.exe").Path
          foreach ($groesse in 16, 32, 48) {
            $ico = New-Object System.Drawing.Icon("assets\icon.ico", $groesse, $groesse)
            Write-Host "icon.ico ${groesse}px geladen: $($ico.Width)x$($ico.Height)"
          }
          $bmp = [System.Drawing.Icon]::ExtractAssociatedIcon($exe).ToBitmap()
          $cyan = 0; $gelb = 0
          for ($x = 0; $x -lt $bmp.Width; $x++) { for ($y = 0; $y -lt $bmp.Height; $y++) {
            $c = $bmp.GetPixel($x, $y)
            if ($c.A -gt 128 -and $c.R -lt 140 -and $c.G -gt 170 -and $c.B -gt 170) { $cyan++ }
            if ($c.A -gt 128 -and $c.R -gt 180 -and $c.G -gt 150 -and $c.B -lt 90) { $gelb++ }
          } }
          Write-Host "Exe-Icon $($bmp.Width)x$($bmp.Height): cyan=$cyan gelb=$gelb"
          if ($cyan -lt 10) { throw "Exe-Icon ist nicht das Programm-Icon" }
          $vi = (Get-Item $exe).VersionInfo
          Write-Host "Exe: ProductName=$($vi.ProductName) ProductVersion=$($vi.ProductVersion) Company=$($vi.CompanyName)"
          if ($vi.ProductName -ne "UPA-Analyzer-Control" -or $vi.ProductVersion -ne "${{ steps.ver.outputs.version }}") { throw "Versionsangaben der .exe falsch" }

      - name: Selbsttest Diagramm + Pruefprotokoll in der .exe
        shell: pwsh
        run: |
          $exe = "dist\UPA-Analyzer-Control\UPA-Analyzer-Control.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--selbsttest" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Selbsttest Exit-Code $($p.ExitCode)" }
          $png = Join-Path ([Environment]::GetFolderPath("MyDocuments")) "UPA-Analyzer-Control\selbsttest\selbsttest_frequenzgang.png"
          if (-not (Test-Path $png)) { throw "Diagramm fehlt" }
          Write-Host "Diagramm OK: $((Get-Item $png).Length) Bytes"
          $prot = Join-Path ([Environment]::GetFolderPath("MyDocuments")) "UPA-Analyzer-Control\selbsttest\protokoll"
          $pdf = Get-ChildItem $prot -Filter "Pruefprotokoll_*.pdf"
          $dx = Get-ChildItem $prot -Filter "Pruefprotokoll_*.docx"
          if (-not $pdf -or -not $dx) { throw "Pruefprotokoll PDF/DOCX fehlt" }
          Write-Host "Protokoll OK: $($pdf.Name) ($($pdf.Length) Bytes), $($dx.Name) ($($dx.Length) Bytes)"

      - name: Starttest Server (ohne Adapter, ohne Fenster)
        shell: pwsh
        run: |
          $exe = "dist\UPA-Analyzer-Control\UPA-Analyzer-Control.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--no-browser","--http","8499" -PassThru
          $null = $p.Handle
          Start-Sleep -Seconds 6
          $html = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8499/).Content
          if ($html -notmatch "ANALYZER CONTROL") { throw "Oberflaeche nicht geliefert" }
          $st = Invoke-RestMethod http://127.0.0.1:8499/api/state
          Write-Host "Oberflaeche OK, Version $($st.app_version)"
          if ($st.app_version -ne "${{ steps.ver.outputs.version }}") { throw "falsche Version" }
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8499/api/quit -Body "{}" -ContentType "application/json" | Out-Null
          if (-not $p.WaitForExit(20000)) { $p.Kill(); throw "QUIT beendet das Programm nicht" }
          if ($p.ExitCode -ne 0) { throw "Exit-Code $($p.ExitCode)" }
          Write-Host "QUIT OK"

      - name: Starttest Programmfenster
        shell: pwsh
        run: |
          $exe = "dist\UPA-Analyzer-Control\UPA-Analyzer-Control.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--http","8498" -PassThru
          $null = $p.Handle
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "Programm nach dem Start beendet (Exit $($p.ExitCode))" }
          $st = Invoke-RestMethod http://127.0.0.1:8498/api/state
          Write-Host "Server laeuft, Version $($st.app_version)"
          $log = Join-Path ([Environment]::GetFolderPath("MyDocuments")) "UPA-Analyzer-Control\upa_log.txt"
          # Zweiter Start auf demselben Port: vorhandenes Fenster nach vorne, sofort beenden
          $p2 = Start-Process -FilePath $exe -ArgumentList "--http","8498" -PassThru
          $null = $p2.Handle
          if ($p2.WaitForExit(15000)) {
            if (Select-String -Path $log -Pattern "nach vorne geholt" -Quiet) { Write-Host "Zweiter Start: Fenster nach vorne geholt" }
            else { Write-Host "::warning::Zweiter Start beendet, aber Fenster nicht gefunden" }
          } else { $p2.Kill(); Write-Host "::warning::Zweiter Start wartet auf eine Rueckfrage (Fenster auf dem Build-Rechner nicht sichtbar)" }
          # Nur Multimeter: Hauptfenster ausblenden, Multimeter-Fenster oeffnen
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8498/api/fenster -Body '{"art":"multimeter","nur":true}' -ContentType "application/json" | Out-Null
          $t0 = Get-Date; $ok = $false
          while (((Get-Date) - $t0).TotalSeconds -lt 25) {
            if (Select-String -Path $log -Pattern "Multimeter-Fenster angezeigt" -Quiet) { $ok = $true; break }
            Start-Sleep -Milliseconds 500 }
          if ($ok) { Write-Host ("Multimeter-Fenster OK nach {0:N1} s" -f ((Get-Date) - $t0).TotalSeconds) }
          else { Write-Host "::warning::Multimeter-Fenster nach 25 s nicht angezeigt" }
          if (-not (Select-String -Path $log -Pattern "Hauptfenster ausgeblendet" -Quiet)) { throw "Nur-Multimeter: Hauptfenster nicht ausgeblendet" }
          # Zweiter Start bei ausgeblendetem Hauptfenster: Multimeter-Fenster muss gefunden werden
          $p3 = Start-Process -FilePath $exe -ArgumentList "--http","8498" -PassThru
          $null = $p3.Handle
          if ($p3.WaitForExit(15000)) { Write-Host "Zweiter Start bei Nur-Multimeter: beendet ohne Rueckfrage" }
          else { $p3.Kill(); Write-Host "::warning::Zweiter Start bei Nur-Multimeter fragt nach (Multimeter-Fenster nicht gefunden)" }
          # UEBERSICHT: Multimeter-Fenster zu, Hauptfenster wieder da
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8498/api/fenster/uebersicht -Body "{}" -ContentType "application/json" | Out-Null
          Start-Sleep -Seconds 4
          if (-not (Select-String -Path $log -Pattern "Hauptfenster wieder angezeigt" -Quiet)) { throw "UEBERSICHT: Hauptfenster nicht zurueck" }
          Write-Host "Nur-Multimeter und UEBERSICHT OK"
          if (Select-String -Path $log -Pattern "NICHT maximiert" -Quiet) { throw "Ein Fenster war nicht maximiert" }
          $mx = (Select-String -Path $log -Pattern ": maximiert" | Measure-Object).Count
          Write-Host "Fenster maximiert (Log-Eintraege): $mx"
          if ($mx -lt 3) { Write-Host "::warning::Maximiert-Zustand nicht fuer alle Fenster protokolliert" }
          # Multimeter-Fenster nochmals oeffnen; QUIT muss beide schliessen
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8498/api/fenster -Body '{"art":"multimeter"}' -ContentType "application/json" | Out-Null
          Start-Sleep -Seconds 4
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8498/api/quit -Body "{}" -ContentType "application/json" | Out-Null
          if (-not $p.WaitForExit(20000)) { $p.Kill(); throw "QUIT schliesst das Programmfenster nicht" }
          if ($p.ExitCode -ne 0) { throw "Exit-Code $($p.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Get-Process -Id $p.Id -ErrorAction SilentlyContinue) { throw "Prozess laeuft nach QUIT weiter" }
          if (-not (Select-String -Path $log -Pattern "Software beendet" -Quiet)) { throw "Beenden nicht protokolliert" }
          Get-Content $log -Tail 30
          if (Select-String -Path $log -Pattern "Programmfenster nicht verfuegbar" -Quiet) {
            Write-Host "::warning::Programmfenster startete auf dem Build-Rechner nicht (Browser-Ersatz lief)"
          } else { Write-Host "Programmfenster OK, QUIT OK" }

      - name: Installer bauen (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC fehlgeschlagen" }
          Get-ChildItem dist-installer

      - name: Setup.exe als Download (Actions)
        uses: actions/upload-artifact@v5
        with:
          name: UPA-Analyzer-Control-${{ steps.ver.outputs.version }}-Setup
          path: dist-installer/*.exe

      - name: Release veroeffentlichen
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: UPA-Analyzer-Control v${{ steps.ver.outputs.version }}
          files: dist-installer/*.exe
          prerelease: ${{ startsWith(steps.ver.outputs.version, '0.') }}   # ab 1.0.0 regulaere Version
          body: |
            Windows-Installation: Setup.exe herunterladen und starten (keine Python-Installation noetig).
            Aenderungen: siehe CHANGELOG.md.
            Hinweis: Die Datei ist (noch) nicht signiert - Windows SmartScreen: "Weitere Informationen" -> "Trotzdem ausfuehren".

            Code signing policy: https://github.com/${{ github.repository }}/blob/main/docs/code-signing-policy.md
